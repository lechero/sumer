# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Developer entry points for the repo: `task` lists them, `task <name> -- <args>`
# passes extra arguments through (e.g. `task import -- osl --limit 500`).
# Each task wraps the pnpm/turbo script of the same name, so both keep working.
version: "3"

vars:
  # Container engine for Postgres: Docker when its daemon answers, else Podman.
  # Override with CONTAINER_ENGINE=docker|podman.
  ENGINE:
    sh: |
      if [ -n "${CONTAINER_ENGINE:-}" ]; then echo "$CONTAINER_ENGINE"
      elif command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then echo docker
      elif command -v podman >/dev/null 2>&1; then echo podman
      else echo docker; fi
  COMPOSE: "{{.ENGINE}} compose"

env:
  # Silences podman's ">>>> Executing external compose provider" banner.
  PODMAN_COMPOSE_WARNING_LOGS: "false"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # ── Setup ────────────────────────────────────────────────────────────────────

  setup:
    desc: "Everything, with Postgres in Docker or Podman: .env, install, start Postgres, migrate + seed, import every dictionary (task setup -- --offline)"
    cmds:
      - task: env
      - task: install
      - task: docker:up
      - task: db:setup
      - task: import:all

  setup:pglite:
    desc: "Everything without containers, using the embedded PGlite database in ./.pglite (task setup:pglite -- --offline)"
    preconditions:
      - sh: '! grep -qs "^DATABASE_URL=." .env'
        msg: ".env sets DATABASE_URL, so the scripts would use Postgres. Clear it, or run `task setup` instead."
    cmds:
      - task: install
      - task: db:setup
      - task: import:all

  env:
    desc: Create .env from .env.example if it does not exist yet
    cmds:
      - cp .env.example .env
    status:
      - test -f .env

  install:
    desc: Install workspace dependencies (skipped when the lockfile and manifests are unchanged)
    run: once
    silent: true
    preconditions:
      - sh: command -v pnpm
        msg: "pnpm not found. Run `corepack enable` to install the version pinned in package.json."
    sources:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/*/package.json
      - packages/*/package.json
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install

  doctor:
    desc: Show the local toolchain and which database the scripts will use
    silent: true
    cmds:
      - 'echo "node    $(node --version 2>/dev/null || echo missing)  (wants v$(cat .node-version))"'
      - 'echo "pnpm    $(pnpm --version 2>/dev/null || echo "missing, run: corepack enable")"'
      - 'echo "engine  {{.ENGINE}}: $({{.ENGINE}} --version 2>/dev/null || echo "missing (optional, PGlite works without it)")"'
      - 'echo "compose $({{.COMPOSE}} version 2>/dev/null | tail -1 || echo missing)"'
      - 'echo "db      $(grep -qs "^DATABASE_URL=." .env && echo "Postgres (DATABASE_URL in .env)" || echo "PGlite (./.pglite)")"'
      - 'echo "cache   $(du -sh .cache/importers 2>/dev/null | cut -f1 || echo empty) in .cache/importers"'

  # ── App ──────────────────────────────────────────────────────────────────────

  dev:
    desc: Start the Next.js dev server on http://localhost:3000
    deps: [install]
    interactive: true
    cmds:
      - pnpm dev

  build:
    desc: Production build of the workspace
    deps: [install]
    cmds:
      - pnpm build

  start:
    desc: Serve the production build of the web app (run `task build` first)
    deps: [install]
    interactive: true
    cmds:
      - pnpm --filter web start

  fonts:
    desc: Rebuild the self-hosted cuneiform web fonts in apps/web/fonts from Oracc's OFL fonts (needs uv)
    preconditions:
      - sh: command -v uv
        msg: "uv not found. Install it with `brew install uv`; the script fetches fontTools itself."
    cmds:
      - uv run apps/web/fonts/build.py

  ui:add:
    desc: "Add shadcn components to packages/ui (task ui:add -- dialog tabs)"
    preconditions:
      - sh: '{{if .CLI_ARGS}}true{{else}}false{{end}}'
        msg: "Name at least one component: task ui:add -- dialog"
    cmds:
      - task: install
      - pnpm dlx shadcn@latest add {{.CLI_ARGS}} -c apps/web

  # ── Quality ──────────────────────────────────────────────────────────────────

  check:
    desc: Typecheck and lint the whole workspace
    cmds:
      - task: typecheck
      - task: lint

  typecheck:
    desc: Run tsc --noEmit across the workspace
    deps: [install]
    cmds:
      - pnpm typecheck

  lint:
    desc: Run ESLint across the workspace
    deps: [install]
    cmds:
      - pnpm lint

  format:
    desc: Format TypeScript sources with Prettier
    deps: [install]
    cmds:
      - pnpm format

  clean:
    desc: Remove build output and turbo caches (keeps node_modules, .pglite and .cache)
    cmds:
      - rm -rf .turbo apps/*/.turbo packages/*/.turbo apps/web/.next

  # ── Database ─────────────────────────────────────────────────────────────────
  # With PGlite only one process can open ./.pglite: stop `task dev` before
  # seeding, importing or printing stats.

  db:setup:
    desc: Apply migrations, then seed the base data
    deps: [install]
    cmds:
      - pnpm db:setup

  db:migrate:
    desc: Apply SQL migrations from packages/db/drizzle
    deps: [install]
    cmds:
      - pnpm db:migrate

  db:seed:
    desc: Upsert the curated seed datasets (re-runnable)
    deps: [install]
    cmds:
      - pnpm db:seed

  db:generate:
    desc: Generate a migration after changing packages/db/src/schema.ts
    deps: [install]
    cmds:
      - pnpm db:generate

  db:stats:
    desc: Print entry counts per language and a few sample searches
    deps: [install]
    cmds:
      - pnpm db:stats

  db:studio:
    desc: Open Drizzle Studio on the configured database
    deps: [install]
    interactive: true
    cmds:
      - pnpm db:studio

  db:psql:
    desc: Open psql inside the Postgres container
    interactive: true
    cmds:
      - "{{.COMPOSE}} exec postgres sh -c 'psql -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"'"

  pglite:reset:
    desc: Delete the embedded PGlite database in ./.pglite and set it up again
    prompt: This deletes ./.pglite, including imported dictionaries. Continue?
    cmds:
      - rm -rf .pglite
      - task: db:setup

  # ── Containers (Docker or Podman, see ENGINE above) ──────────────────────────

  docker:up:
    desc: Start Postgres (Docker or Podman) and wait until it is healthy
    aliases: [up]
    preconditions:
      - sh: "{{.ENGINE}} info >/dev/null 2>&1"
        msg: "{{.ENGINE}} is not running. Start it (`podman machine start`, or Docker Desktop / Rancher), or use PGlite instead (`task setup:pglite`)."
    cmds:
      - "{{.COMPOSE}} up -d --wait"

  docker:down:
    desc: Stop the Postgres container (data is kept)
    aliases: [down]
    cmds:
      - "{{.COMPOSE}} down"

  docker:reset:
    desc: Stop Postgres and delete its volume
    prompt: This deletes the Postgres volume and every row in it. Continue?
    cmds:
      - "{{.COMPOSE}} down -v"

  docker:logs:
    desc: Follow the Postgres container logs
    cmds:
      - "{{.COMPOSE}} logs -f postgres"

  # ── Dictionaries ─────────────────────────────────────────────────────────────

  import:
    desc: "Download and load lexica (task import -- osl epsd2 [--limit N] [--offline] [--prune])"
    deps: [install]
    cmds:
      - pnpm run import {{.CLI_ARGS}}

  import:all:
    desc: "Run every importer in order (task import:all -- --offline)"
    deps: [install]
    cmds:
      - pnpm run import --all {{.CLI_ARGS}}

  render:
    desc: 'Render transliterations as cuneiform (task render -- e2-gal "{d}en-lil2")'
    preconditions:
      - sh: '{{if .CLI_ARGS}}true{{else}}false{{end}}'
        msg: 'Pass at least one transliteration: task render -- e2-gal'
    cmds:
      - task: install
      - pnpm --filter @workspace/importers render {{.CLI_ARGS}}
