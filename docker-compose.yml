name: sumer

services:
  postgres:
    image: postgres:17-alpine
    container_name: sumer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sumer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sumer}
      POSTGRES_DB: ${POSTGRES_DB:-sumer}
      # Ancient-language text: make sure the cluster is UTF-8 with a neutral collation.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sumer} -d ${POSTGRES_DB:-sumer}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
